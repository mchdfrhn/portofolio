en:
  tagline: Clinic landing page · client project at Surupan Software House
  problem: >-
    A premium beauty clinic needed a website that matched its brand and made
    it easy for visitors to book a treatment.
  solution: >-
    Designed and built a landing page with Next.js and Tailwind CSS: an
    elegant layout, fluid animations, and a booking flow that hands visitors
    straight to WhatsApp. Deployed on Vercel.
  impact: >-
    The clinic's landing page, with WhatsApp as the single booking channel.
id:
