en:
  tagline: Employee Management Dashboard
  problem: >-
    Manual processing of massive bureaucratic employee records and hierarchy
    changes.
  solution: >-
    Engineered an automated HR dashboard handling streamlined XLSX data
    ingestion with granular RBAC.
  impact: >-
    Centralized tracking for thousands of active civil servants, cutting admin
    work by hours.
id:
  tagline: Dashboard Manajemen Pegawai
  problem: >-
    Pengolahan manual ribuan data kepegawaian birokrasi dan perubahan hierarki
    yang memakan waktu.
  solution: >-
    Membangun dashboard HR otomatis dengan fitur impor data XLSX dan kontrol
    akses berbasis peran (RBAC).
  impact: >-
    Sentralisasi data ribuan ASN aktif, memangkas pekerjaan administratif secara
    signifikan.
