en:
  tagline: Academic Workflow System
  problem: >-
    Students submitted academic letters and requests on paper and had to queue
    for them. Staff had no single place to see what was pending, and students
    had no way to know when their request was done.
  solution: >-
    Built a digital submission system with React and Node.js. Students submit
    requests online, admins review them from one dashboard with a single click,
    and every status change is sent to the student over WhatsApp.
  impact: >-
    Replaced the paper queue for around 300 active students across 3 study
    programs. Every submission is now tracked in one place and students are
    notified automatically.
id:
  tagline: Sistem Alur Pengajuan Akademik
  problem: >-
    Mahasiswa mengajukan surat dan permohonan akademik di atas kertas dan harus
    mengantre. Staf tidak punya satu tempat untuk melihat pengajuan yang belum
    diproses, dan mahasiswa tidak tahu kapan pengajuannya selesai.
  solution: >-
    Membangun sistem pengajuan digital dengan React dan Node.js. Mahasiswa
    mengajukan secara online, admin meninjau dari satu dashboard dengan sekali
    klik, dan setiap perubahan status dikirim ke mahasiswa lewat WhatsApp.
  impact: >-
    Menggantikan antrean kertas untuk sekitar 300 mahasiswa aktif di 3 program
    studi. Semua pengajuan kini tercatat di satu tempat dan mahasiswa mendapat
    notifikasi otomatis.
