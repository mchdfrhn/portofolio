en:
  tagline: Academic & Student Information System
  problem: >-
    Manual academic administration made student services, data updates, and
    document workflows slower and harder to track.
  solution: >-
    Built an integrated academic and student information system with structured
    data models, responsive interfaces, and workflow-focused modules for campus
    services.
  impact: >-
    Helped digitalize campus services, improve academic data management, and
    reduce repetitive manual administration.
id:
  tagline: Sistem Informasi Akademik & Kemahasiswaan
  problem: >-
    Administrasi akademik manual membuat layanan mahasiswa, pembaruan data, dan
    workflow dokumen lebih lambat serta sulit dilacak.
  solution: >-
    Membangun sistem informasi akademik dan kemahasiswaan terintegrasi dengan
    model data terstruktur, antarmuka responsif, dan modul yang fokus pada
    workflow layanan kampus.
  impact: >-
    Membantu digitalisasi layanan kampus, memperbaiki pengelolaan data akademik,
    dan mengurangi administrasi manual yang repetitif.
