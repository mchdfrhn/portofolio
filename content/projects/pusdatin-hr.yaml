en:
  tagline: HR Management & Functional Position System
  problem: >-
    Employee records, hierarchy changes, and functional credit points for
    140+ Pusdatin employees were tracked manually in spreadsheets,
    slowing down assessments and promotions.
  solution: >-
    Built an integrated HR platform with automated XLSX data ingestion,
    granular RBAC, and SSR-powered performance credit point calculation —
    covering both employee management and functional position tracking.
    Implemented Python + SQL ETL pipelines to migrate the existing
    spreadsheet data.
  impact: >-
    Centralized personnel and functional position data for 140+
    Pusdatin employees in one dashboard, with credit points calculated
    automatically instead of by hand.
id:
  tagline: Sistem Manajemen Kepegawaian & Jabatan Fungsional
  problem: >-
    Data kepegawaian, perubahan hierarki, dan angka kredit jabatan fungsional
    untuk 140+ pegawai Pusdatin dikelola manual di spreadsheet,
    sehingga penilaian dan promosi sering terlambat.
  solution: >-
    Membangun platform HR terintegrasi dengan fitur impor data XLSX otomatis,
    RBAC berbasis peran, dan perhitungan angka kredit kinerja berbasis SSR —
    mencakup manajemen pegawai dan pelacakan jabatan fungsional.
    Mengimplementasikan pipeline ETL Python + SQL untuk memigrasikan data
    spreadsheet yang sudah ada.
  impact: >-
    Data kepegawaian dan jabatan fungsional 140+ pegawai Pusdatin kini
    terpusat dalam satu dashboard, dengan angka kredit dihitung otomatis, bukan
    manual.
