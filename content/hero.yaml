en:
  headline: I build the software public institutions run on.
  intro: I'm Farhan. For the past two years I've been building academic and HR
    systems for a public-works college and the Ministry of Public Works —
    TypeScript, Next.js and PostgreSQL, from the database schema to the deploy.
    Right now I'm at Hino, modernizing and troubleshooting internal and dealer
    systems with FastAPI and Next.js.
id:
  headline: Saya membangun software yang menjalankan institusi publik.
  intro: Saya Farhan. Dua tahun terakhir saya membangun sistem akademik dan
    kepegawaian untuk kampus pekerjaan umum dan Kementerian Pekerjaan Umum —
    TypeScript, Next.js, dan PostgreSQL, dari skema database sampai deploy.
    Sekarang saya di Hino, memodernisasi dan men-troubleshoot sistem internal
    dan dealer dengan FastAPI dan Next.js.
