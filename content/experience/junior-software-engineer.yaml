en:
  title: Software Engineer (Fullstack)
  company: Sekolah Tinggi Teknologi Pekerjaan Umum Jakarta
  description: >-
    Designed and shipped SIPEKAD, an academic submission system used by around
    300 active students across 3 study programs. Built with React, Node.js, and
    the WhatsApp API — students submit requests online, admins review them in
    one click, and status updates reach students on WhatsApp.
    Also developed the official institutional website with Payload CMS and
    authored complete technical documentation and system architecture diagrams
    to ensure long-term maintainability.
