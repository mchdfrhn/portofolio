name: Academic Information System Operator
type: work
period: 2022 - 2026
order: 5
en:
  title: Academic Information System Operator
  company: Sekolah Tinggi Teknologi Pekerjaan Umum Jakarta
  description: >-
    Kept the college's academic data accurate and available, from student
    registration and class schedules to grade compilation, and maintained
    student records from enrollment through graduation. Supported staff and
    students on the academic information system and ran user training sessions
    for administrative staff.
id:
  title: Operator Sistem Informasi Akademik
  company: Sekolah Tinggi Teknologi Pekerjaan Umum Jakarta
  description: >-
    Menjaga data akademik kampus tetap akurat dan tersedia, mulai dari
    registrasi mahasiswa dan jadwal kuliah hingga rekap nilai, serta merawat
    data mahasiswa dari awal masuk hingga lulus. Memberi bantuan teknis kepada
    staf dan mahasiswa terkait sistem informasi akademik dan mengadakan
    pelatihan pengguna untuk staf administrasi.
